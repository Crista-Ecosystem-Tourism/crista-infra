---
- name: Установить timezone
  community.general.timezone:
    name: "{{ timezone }}"
  when: timezone is defined

- name: Обновить apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Установить базовые пакеты
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

- name: Включить unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Создать swap-файл
  when: manage_swap | bool
  block:
    - name: Проверить swap-файл
      ansible.builtin.stat:
        path: "{{ swap_path }}"
      register: swap_stat

    - name: fallocate swap-файл
      ansible.builtin.command: "fallocate -l {{ swap_size_mb }}M {{ swap_path }}"
      args:
        creates: "{{ swap_path }}"
      when: not swap_stat.stat.exists

    - name: Права swap-файла
      ansible.builtin.file:
        path: "{{ swap_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: mkswap
      ansible.builtin.command: "mkswap {{ swap_path }}"
      register: mkswap_run
      changed_when: "'Setting up swapspace' in mkswap_run.stdout or 'mkswap' in mkswap_run.stderr"
      failed_when: mkswap_run.rc != 0 and 'already' not in mkswap_run.stderr

    - name: swapon
      ansible.builtin.command: "swapon {{ swap_path }}"
      register: swapon_run
      changed_when: swapon_run.rc == 0
      failed_when: swapon_run.rc != 0 and 'already' not in swapon_run.stderr

    - name: fstab запись для swap
      ansible.posix.mount:
        path: none
        src: "{{ swap_path }}"
        fstype: swap
        opts: sw
        state: present

- name: Настроить ufw
  when: manage_firewall | bool
  block:
    - name: ufw — default deny incoming
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: ufw — default allow outgoing
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: ufw — открыть нужные TCP порты
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "{{ item }}"
      loop: "{{ allowed_tcp_ports }}"

    - name: ufw — включить
      community.general.ufw:
        state: enabled

- name: Настроить sshd_config
  when: harden_ssh | bool
  block:
    - name: PasswordAuthentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication "
        line: "PasswordAuthentication {{ ssh_password_authentication }}"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: restart sshd

    - name: PermitRootLogin
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin "
        line: "PermitRootLogin {{ ssh_permit_root_login }}"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: restart sshd
