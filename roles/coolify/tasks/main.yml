---
# Идемпотентная установка Coolify через официальный installer.
# Запускается только если coolify ещё не установлен.

- name: Проверить наличие установленного Coolify
  ansible.builtin.stat:
    path: "{{ coolify_data_dir }}/source/docker-compose.yml"
  register: coolify_compose

# Сеть VPS → CDN часто плохая: качаем на control node (Mac) в файл без гигантского Jinja —
# иначе lookup(url)+copy грузит весь скрипт в RAM и воркер Python падает («dead state»).
- name: Каталог кэша установщика на control node
  ansible.builtin.file:
    path: "{{ playbook_dir }}/.ansible-cache"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true
  when: not coolify_compose.stat.exists

- name: Скачать Coolify installer на control node
  ansible.builtin.get_url:
    url: "{{ coolify_installer_url }}"
    dest: "{{ playbook_dir }}/.ansible-cache/coolify-install.sh"
    mode: "0755"
    force: true
    timeout: 120
  delegate_to: localhost
  become: false
  run_once: true
  when: not coolify_compose.stat.exists

- name: Скопировать установщик на сервер
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/.ansible-cache/coolify-install.sh"
    dest: /root/coolify-install.sh
    mode: "0755"
    force: true
  when: not coolify_compose.stat.exists

- name: Запустить Coolify installer
  ansible.builtin.command: bash /root/coolify-install.sh
  args:
    creates: "{{ coolify_data_dir }}/source/docker-compose.yml"
  when: not coolify_compose.stat.exists

- name: Coolify уже установлен — пропуск
  ansible.builtin.debug:
    msg: "Coolify уже установлен в {{ coolify_data_dir }}, инсталлятор пропущен."
  when: coolify_compose.stat.exists
